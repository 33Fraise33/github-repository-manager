name: OpenTofu CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    concurrency:
      group: tofu-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize without backend
        run: tofu init -backend=false -lockfile=readonly

      - name: Validate configuration
        run: tofu validate

      - name: Run mocked OpenTofu tests
        run: tofu test

      - name: Test sanitized plan review
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'

  trusted-plan:
    name: Trusted speculative plan
    needs: validate
    if: >-
      vars.ENABLE_TRUSTED_TOFU_PLAN == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    environment: repository-plan
    concurrency:
      group: tofu-trusted-plan-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out planned commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Configure temporary backend file
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -eu
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ]; then
            printf '%s\n' 'Trusted plan is enabled but R2_BUCKET or R2_ENDPOINT is not configured.' >&2
            exit 1
          fi
          case "$R2_ENDPOINT" in
            https://*.r2.cloudflarestorage.com) ;;
            *) printf '%s\n' 'R2_ENDPOINT must be an HTTPS Cloudflare R2 S3 endpoint.' >&2; exit 1 ;;
          esac
          case "$R2_BUCKET" in
            *[!a-z0-9.-]*|'') printf '%s\n' 'R2_BUCKET contains unsupported characters.' >&2; exit 1 ;;
          esac
          umask 077
          python3 - "$R2_BUCKET" "$R2_ENDPOINT" > "$RUNNER_TEMP/backend.ci.tfbackend" <<'PY'
          import json
          import sys

          print(f"bucket = {json.dumps(sys.argv[1])}")
          print(f"endpoints = {{ s3 = {json.dumps(sys.argv[2])} }}")
          PY

      - name: Verify configured GitHub credential
        env:
          GITHUB_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -eu
          if [ -z "$GITHUB_TOKEN" ]; then
            printf '%s\n' 'Trusted plan requires the REPOSITORY_ADMIN_TOKEN environment secret.' >&2
            exit 1
          fi
          identity_dir="$RUNNER_TEMP/tofu-identity"
          mkdir -p "$identity_dir"
          cp .terraform.lock.hcl "$identity_dir/.terraform.lock.hcl"
          cat > "$identity_dir/main.tf" <<'EOF'
          terraform {
            required_version = ">= 1.12.0, < 1.13.0"
            required_providers {
              github = {
                source  = "integrations/github"
                version = "= 6.13.0"
              }
            }
          }

          provider "github" {
            owner         = "33Fraise33"
            legacy_client = false
          }

          data "github_user" "current" {
            username = ""
            lifecycle {
              postcondition {
                condition     = lower(self.login) == "33fraise33"
                error_message = "GITHUB_TOKEN must authenticate as 33Fraise33."
              }
            }
          }

          output "authenticated_login" {
            value = data.github_user.current.login
          }
          EOF
          if ! tofu -chdir="$identity_dir" init -backend=false -lockfile=readonly >/dev/null; then
            printf '%s\n' 'Could not initialize provider for the read-only identity check.' >&2
            exit 1
          fi
          if ! tofu -chdir="$identity_dir" plan -input=false -no-color > "$RUNNER_TEMP/tofu-identity.log" 2>&1; then
            printf '%s\n' 'GitHub authentication or account identity check failed. Confirm the approved token permissions and expected account.' >&2
            rm -f "$RUNNER_TEMP/tofu-identity.log"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/tofu-identity.log"

      - name: Initialize remote backend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_DATA_DIR: ${{ runner.temp }}/tofu-remote-data
        run: scripts/tofu init -input=false -lockfile=readonly -backend-config="$RUNNER_TEMP/backend.ci.tfbackend"

      - name: Create and summarize speculative plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
          TF_IN_AUTOMATION: "1"
          TF_INPUT: "0"
          TF_DATA_DIR: ${{ runner.temp }}/tofu-remote-data
        run: |
          set -eu
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            printf '%s\n' 'Trusted plan requires R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY environment secrets.' >&2
            exit 1
          fi
          if [ -z "$GITHUB_TOKEN" ]; then
            printf '%s\n' 'Trusted plan requires the REPOSITORY_ADMIN_TOKEN environment secret.' >&2
            exit 1
          fi
          plan_file=$(mktemp "$RUNNER_TEMP/tofu-plan.XXXXXX")
          json_file=$(mktemp "$RUNNER_TEMP/tofu-plan-json.XXXXXX")
          summary_file=$(mktemp "$RUNNER_TEMP/tofu-summary.XXXXXX")
          trap 'rm -f "$plan_file" "$json_file" "$summary_file" "$RUNNER_TEMP/tofu-plan.log" "$RUNNER_TEMP/backend.ci.tfbackend"' EXIT

          printf '%s\n' '### Trusted OpenTofu speculative plan' > "$summary_file"
          plan_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          printf '\n- Commit: `%s`\n- Target owner: `33Fraise33`\n' "$plan_commit" >> "$summary_file"
          if ! tofu plan -input=false -lock-timeout=5m -no-color -out="$plan_file" > "$RUNNER_TEMP/tofu-plan.log" 2>&1; then
            printf '\nPlan failed. Check authentication, backend configuration, and runner logs (credential values are not printed).\n' >> "$summary_file"
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! tofu show -json "$plan_file" > "$json_file"; then
            printf '\nPlan was created, but sanitized summary generation failed.\n' >> "$summary_file"
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          summary_status=0
          python3 scripts/summarize-tofu-plan.py "$json_file" >> "$summary_file" || summary_status=$?
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          if [ "$summary_status" -ne 0 ]; then
            exit "$summary_status"
          fi

      - name: Remove temporary backend configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/backend.ci.tfbackend"
